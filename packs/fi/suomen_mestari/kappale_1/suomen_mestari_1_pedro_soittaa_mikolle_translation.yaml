metadata:
  id: suomen_mestari_1_pedro_soittaa_mikolle
  title: "Suomen Mestari 1 - Pedro soittaa Mikolle"
  type: translation
  format: mixed
  version: 1
  schema_version: 2
  source_language: fi
  target_language: en-US

entries:
  - id: e001
    type: narration
    source: "Mikko on Pedron hyvä ystävä."
    target: "Mikko is Pedro's good friend."
    literal: "Mikko is Pedro's good friend."
    chunks:
      - id: c001
        source: "Mikko on"
        literal: "Mikko is"
        target: "Mikko is"
      - id: c002
        source: "Pedron hyvä ystävä"
        literal: "Pedro's good friend"
        target: "Pedro's good friend"
        hint: "\"Pedron\" is the genitive form, meaning \"Pedro's\"."
    vocabulary_refs:
      - olla
      - hyvä
      - ystävä
    grammar:
      refs:
        - genitive_case

  - id: e002
    type: narration
    source: "Mikko on suomalainen, mutta hän asuu nyt São Paulossa, Brasiliassa."
    target: "Mikko is Finnish, but he now lives in São Paulo, Brazil."
    literal: "Mikko is Finnish, but he lives now in São Paulo, in Brazil."
    chunks:
      - id: c001
        source: "Mikko on suomalainen"
        literal: "Mikko is Finnish"
        target: "Mikko is Finnish"
      - id: c002
        source: "mutta hän asuu nyt"
        literal: "but he lives now"
        target: "but he now lives"
      - id: c003
        source: "São Paulossa, Brasiliassa"
        literal: "in São Paulo, in Brazil"
        target: "in São Paulo, Brazil"
        hint: "\"-ssa/-ssä\" marks location: \"in\" or \"at\"."
    vocabulary_refs:
      - suomalainen
      - mutta
      - hän
      - asua
      - nyt
    grammar:
      refs:
        - inessive_case

  - id: e003
    type: narration
    source: "Tänään Pedro soittaa Mikolle videopuhelun."
    target: "Today Pedro makes a video call to Mikko."
    literal: "Today Pedro calls to Mikko a video call."
    chunks:
      - id: c001
        source: "Tänään"
        literal: "Today"
        target: "Today"
      - id: c002
        source: "Pedro soittaa Mikolle"
        literal: "Pedro calls to Mikko"
        target:
          - "Pedro calls Mikko"
          - "Pedro calls to Mikko"
        hint: "\"Mikolle\" means \"to Mikko\"."
      - id: c003
        source: "videopuhelun"
        literal: "a video call"
        target: "a video call"
    vocabulary_refs:
      - tänään
      - soittaa
      - videopuhelu
    grammar:
      refs:
        - allative_case
        - object_case

  - id: e004
    type: dialogue
    speaker: Pedro
    source: "Moi Mikko! Oletko jo töissä?"
    target: "Hi Mikko! Are you already at work?"
    literal: "Hi Mikko! Are you already in work?"
    chunks:
      - id: c001
        source: "Moi Mikko!"
        literal: "Hi Mikko!"
        target:
          - "Hi Mikko!"
          - "Hello Mikko!"
      - id: c002
        source: "Oletko jo"
        literal: "Are you already"
        target: "Are you already"
        hint: "\"-ko\" turns \"olet\" into a yes/no question."
      - id: c003
        source: "töissä"
        literal: "in work"
        target: "at work"
        hint: "\"töissä\" is the common Finnish expression for \"at work\"."
    vocabulary_refs:
      - moi
      - olla
      - jo
      - työ
    grammar:
      refs:
        - yes_no_question
        - inessive_case

  - id: e005
    type: dialogue
    speaker: Mikko
    source: "No moi! En vielä. Kello on täällä vasta puoli kahdeksan."
    target: "Well hi! Not yet. It's only half past seven here."
    literal: "Well hi! I don't yet. The clock is here only half eight."
    chunks:
      - id: c001
        source: "No moi!"
        literal: "Well hi!"
        target:
          - "Well hi!"
          - "Hi there!"
      - id: c002
        source: "En vielä"
        literal: "I don't yet"
        target:
          - "Not yet"
          - "I am not yet"
        hint: "\"En\" is the first-person negative verb."
      - id: c003
        source: "Kello on täällä vasta"
        literal: "The clock is here only"
        target:
          - "It is only here"
          - "It's only here"
      - id: c004
        source: "puoli kahdeksan"
        literal: "half eight"
        target:
          - "half past seven"
          - "7:30"
        hint: "In Finnish, \"puoli kahdeksan\" means halfway to eight: 7:30."
    vocabulary_refs:
      - "no"
      - moi
      - ei
      - vielä
      - kello
      - täällä
      - vasta
    grammar:
      refs:
        - negative_verb
        - telling_time

  - id: e006
    type: dialogue
    speaker: Pedro
    source: "Ai niin, totta. No, mitä kuuluu?"
    target: "Oh right, true. So, how are you?"
    literal: "Oh so, true. Well, what is heard?"
    chunks:
      - id: c001
        source: "Ai niin"
        literal: "Oh so"
        target:
          - "Oh right"
          - "Ah yes"
      - id: c002
        source: "totta"
        literal: "true"
        target:
          - "true"
          - "right"
      - id: c003
        source: "No, mitä kuuluu?"
        literal: "Well, what is heard?"
        target:
          - "So, how are you?"
          - "Well, how's it going?"
        hint: "\"Mitä kuuluu?\" is an idiomatic greeting."
    vocabulary_refs:
      - ai niin
      - totta
      - "no"
      - mitä kuuluu
    grammar:
      refs:
        - idiomatic_greeting

  - id: e007
    type: dialogue
    speaker: Mikko
    source: "Ihan hyvää, mutta sää on nyt huono."
    target: "Pretty good, but the weather is bad now."
    literal: "Quite good, but weather is now bad."
    chunks:
      - id: c001
        source: "Ihan hyvää"
        literal: "Quite good"
        target:
          - "Pretty good"
          - "Quite good"
      - id: c002
        source: "mutta sää on nyt huono"
        literal: "but weather is now bad"
        target: "but the weather is bad now"
    vocabulary_refs:
      - ihan
      - hyvä
      - mutta
      - sää
      - nyt
      - huono

  - id: e008
    type: dialogue
    speaker: Mikko
    source: "Tänäänkin sataa kaatamalla ja on tuulista."
    target: "Today too, it's pouring rain and windy."
    literal: "Today also it rains by pouring and is windy."
    chunks:
      - id: c001
        source: "Tänäänkin"
        literal: "today also"
        target:
          - "today too"
          - "even today"
        hint: "\"-kin\" adds \"also\" or \"too\"."
      - id: c002
        source: "sataa kaatamalla"
        literal: "rains by pouring"
        target:
          - "it's pouring rain"
          - "it is raining heavily"
        hint: "\"sataa kaatamalla\" is an idiom meaning it is raining very hard."
      - id: c003
        source: "ja on tuulista"
        literal: "and is windy"
        target: "and it is windy"
    vocabulary_refs:
      - tänään
      - sataa
      - kaatamalla
      - ja
      - tuulinen
    grammar:
      refs:
        - clitic_kin
        - weather_expression

  - id: e009
    type: dialogue
    speaker: Pedro
    source: "Aijaa! Täällä aurinko paistaa ja on tosi lämmin, +25 astetta."
    target: "Oh really! The sun is shining here and it's really warm, 25 degrees."
    literal: "Oh really! Here sun shines and is really warm, +25 degrees."
    chunks:
      - id: c001
        source: "Aijaa!"
        literal: "Oh really!"
        target:
          - "Oh really!"
          - "I see!"
      - id: c002
        source: "Täällä aurinko paistaa"
        literal: "Here sun shines"
        target: "The sun is shining here"
      - id: c003
        source: "ja on tosi lämmin"
        literal: "and is really warm"
        target: "and it's really warm"
      - id: c004
        source: "+25 astetta"
        literal: "+25 degrees"
        target:
          - "25 degrees"
          - "+25 degrees"
    vocabulary_refs:
      - aijaa
      - täällä
      - aurinko
      - paistaa
      - tosi
      - lämmin
      - aste
    grammar:
